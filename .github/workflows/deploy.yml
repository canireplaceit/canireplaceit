name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Released version to deploy, with or without the v (e.g. 0.0.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve version
        id: v
        env:
          IN: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          [ -z "$IN" ] && IN="${REF#refs/tags/}"
          V="${IN#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "not a version: $IN" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: v${{ steps.v.outputs.version }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Install slim
        run: |
          curl -sL https://github.com/slimtoolkit/slim/releases/download/1.40.11/dist_linux.tar.gz | tar xz
          sudo cp -a dist_linux/. /usr/local/bin/

      - name: Build and slim
        env:
          SITE_URL: https://${{ vars.SITE_DOMAIN }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          TAG: ${{ steps.v.outputs.version }}
        run: ./scripts/build-images.sh

      - name: Push
        env:
          V: ${{ steps.v.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          for img in be fe; do
            SRC="canireplaceit/canireplaceit-${img}:${V}"
            DST="ghcr.io/${OWNER,,}/canireplaceit-${img}:${V}"
            docker tag "$SRC" "$DST"
            docker push "$DST"
          done

      - name: Deploy
        env:
          IMAGE_TAG: ${{ steps.v.outputs.version }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          UMAMI_HOST: ${{ vars.UMAMI_HOST }}
          APP_DIR: ${{ vars.APP_DIR }}
          NGINX_CONF_DIR: ${{ vars.NGINX_CONF_DIR }}
          NGINX_CONTAINER: ${{ vars.NGINX_CONTAINER }}
        run: ./scripts/deploy.sh
