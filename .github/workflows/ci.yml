name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint · types · tests · content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bunx biome check apps packages scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Content
        run: bun run validate

      # The build is here for one reason: a whole class of fault exists only in
      # the assembled output. The site once shipped 8260 links to a page nobody
      # built — /en/estimate/ and /fr/estimation/, one on every page — while
      # lint, types, tests and validate all passed, because the links were
      # type-correct, the route parsed, and validation only reads data/.
      - name: Build
        run: bun run build

      - name: Internal links resolve
        run: bun run check:links
