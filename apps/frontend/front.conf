# $uri keeps its trailing slash, so `$uri.md` advertised `/en/tools/joplin/.md`
# on the slash form, which is a 404, while `/en/tools/joplin.md` is a 200. Since
# both slash forms started answering 200 this reached roughly half of all
# requests. A map rather than a regex capture in the location, because the
# location pattern is already load-bearing about ordering and should stay
# readable.
map $uri $cri_md_base {
    default   $uri;
    ~^(.+)/$  $1;
}

server {
    listen 80 default_server;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # This container only ever sees its own internal name and port, so any
    # Location nginx builds itself named http://<container>/… — a protocol
    # downgrade on the site's own canonical URLs. Relative redirects let the
    # public nginx keep the scheme and host it already knows.
    absolute_redirect off;

    # The site served gzip and nothing else: every text response was 10-17%
    # larger than brotli would have made it. The public nginx cannot fix that — it
    # is shared with the other sites on the box and has no brotli module — but it
    # does not have to. It only forwards what this one produces, and
    # forwarding an encoded body needs no module at all. So the compression
    # moves here, where the module is built into the image on purpose
    # (apps/frontend/Dockerfile), and the public nginx's own `gzip on` stays as
    # the fallback for the API responses it still serves itself.
    brotli on;
    # Measured over 64 real pages, bundles and Markdown twins against the
    # gzip level 6 those responses ship at today: 4 is -2.0%, 6 is -8.7%, and 9
    # is -10.1% for 1.7x the CPU of 6. On the pages that matter most the gap is
    # wider than that average: the home document goes 69,357 bytes to 58,889.
    brotli_comp_level 6;
    # The same floor as the public nginx's gzip_min_length, and for the same
    # reason: favicon.svg is 843 bytes.
    brotli_min_length 256;
    # text/html is always included and cannot be listed. The rest mirrors the
    # public nginx's gzip_types, text/markdown included — every page here has a
    # Markdown twin beside it, and those are the files built for AI crawlers.
    brotli_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/atom+xml application/manifest+json image/svg+xml;

    # Serve the precompressed .br and .gz twins scripts/precompress.ts writes
    # beside the hashed bundles. Those are worth compressing once at brotli 11
    # rather than per request at 6: five files, a content hash in every name, and
    # every visitor downloads all of them cold. `gzip_static` was already here
    # with nothing writing a .gz for it to find. If the prerendered pages are
    # ever precompressed too, this picks them up with no change.
    brotli_static on;
    gzip_static on;
    # Both static handlers and the brotli filter take their Vary from this one
    # directive. Without it a shared cache can hand a brotli body to a client
    # that never asked for one.
    gzip_vary on;

    # Hashed filenames — safe to cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Social cards. A day, not `immutable`: the filenames are stable, and every
    # platform caches by URL on its own side anyway, so this only buys a browser
    # round-trip. Longer than a day needs versioned filenames first.
    location ^~ /og/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # The fallback card lives at the root, so it missed the block above and was
    # the one social image on the site served `no-cache` -- while also being the
    # most-referenced, since every page without its own card points here.
    location = /og.png {
        add_header Cache-Control "public, max-age=86400";
    }

    # Browsers and several unfurlers request /favicon.ico unconditionally,
    # whatever the <link rel=icon> tags say. Without this each one costs a 3.3 KB
    # HTML 404. Every current browser accepts a PNG served under the .ico name.
    # The IndexNow protocol requires this to be publicly fetchable, so it is not
    # a leak -- but it is 32 bytes of hex with no reason to be in an index.
    location = /indexnow-key.txt {
        add_header X-Robots-Tag "noindex" always;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon-96x96.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~ ^/(favicon\.svg|favicon-96x96\.png|icon-(192|512)\.png|apple-touch-icon\.png|logo-512\.png)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # nginx's mime.types has no .webmanifest entry, so without this the manifest
    # ships as application/octet-stream and the browser ignores it.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Regenerated on every deploy. A crawler holding these for a year is a
    # crawler working from last month's inventory.
    location ~ ^/(sitemap.*\.xml|robots\.txt|llms\.txt|counts\.json)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The published agent skill. One file on disk, two URLs: the discovery path
    # an agent runtime looks under, and a short one a person can paste.
    location = /skill.md {
        alias /usr/share/nginx/html/agent-skills/canireplaceit/SKILL.md;
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "public, max-age=3600";
    }

    # The build writes these to /agent-skills/ because a bundler copying a
    # public/ directory cannot be relied on to carry a dot-prefixed one.
    location ^~ /.well-known/agent-skills/ {
        alias /usr/share/nginx/html/agent-skills/;
        types {
            application/json json;
            text/markdown   md;
        }
        default_type application/json;
        charset utf-8;
        charset_types text/markdown application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Every page has a Markdown twin beside it. Without this nginx has no type
    # for .md and hands back octet-stream, which a browser downloads and some
    # crawlers skip.
    #
    # The twins double the crawlable URL space and Markdown has nowhere to put a
    # canonical link, so the header is the only way to say "the HTML is the real
    # one". Search engines drop them from the index; agents and LLM crawlers
    # ignore the header and keep reading them, which is the split we want.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # These 26 directories have children but no index.html of their own, so
    # nginx answered them with its stock 403 — which Google records as "blocked"
    # and retries forever, unlike a 404 it eventually drops. Nothing on the site
    # links to them; Googlebot path-trims its way to them anyway, and llms.txt
    # names /en/alternatives/ outright.
    #
    # /themes/ is a duplicate of /categories/ (routes.ts parses the bare
    # `groups` segment as the categories page), so it redirects there rather
    # than to the locale root.
    # Matched with a trailing-slash-optional regex, not `location =`, because the
    # no-slash form 403s the same way and nothing should answer 403 here.
    location ~ ^/(en|fr)/themes/?$ { return 301 /$1/categories/$is_args$args; }

    # Bare pagination parents. /…/page/ carries no page number, so it means
    # nothing on its own; its unpaginated base is the same list from the top.
    #
    # A regex per shape rather than one `location =` per collection: four
    # collections have no /page/ parent today only because they are short
    # enough not to paginate. The day one of them grows past a page, an
    # enumerated list would 403 until somebody remembered to regenerate it.
    location ~ ^/(en|fr)/page/?$ { return 301 /$1/$is_args$args; }
    location ~ ^/en/tools/page/?$ { return 301 /en/tools/$is_args$args; }
    location ~ ^/fr/outils/page/?$ { return 301 /fr/outils/$is_args$args; }
    location ~ ^/(en|fr)/collections/([a-z0-9-]+)/page/?$ { return 301 /$1/collections/$2$is_args$args; }

    # /en/gaps/index.html served the same document as /en/gaps, so every page on
    # the site had a second URL nobody meant to publish. The canonical already
    # names the directory form; this makes the server agree.
    location ~ ^(.*)/index\.html$ { return 301 $1/$is_args$args; }

    # Advertise the Markdown twin on the HTML page, so an agent learns it exists
    # from a HEAD request instead of pulling 200 KB of HTML to read one <link>.
    # LAST of the regex locations on purpose: nginx takes the first regex that
    # matches, and this pattern also matches the .md twins and every redirect
    # above it, so anywhere earlier it would swallow them.
    location ~ ^/(en|fr)(/.*)?$ {
        # Capture the REQUEST path before try_files rewrites it. add_header
        # interpolates when the header is sent, which is after the rewrite, so
        # $uri had already become /en/about/index.html and the header advertised
        # /en/about/index.html.md -- a 404. The in-page <link> was always right,
        # which is why nothing caught it.
        set $cri_md $cri_md_base;
        add_header Link '<$cri_md.md>; rel="alternate"; type="text/markdown"' always;
        # This location declared none, and add_header does not inherit into a level
        # that declares one of its own, so every prerendered page shipped with no
        # Cache-Control at all while `location /` and the .md twins both said
        # no-cache. With no header Chrome falls back to heuristic freshness at 10%
        # of the age since Last-Modified, a window that grows the longer the site
        # goes without a deploy, so a quiet week serves hours-old prices from cache.
        # no-cache still caches: it revalidates, and an unchanged page comes back
        # 304 with no body. On a site whose whole claim is that its numbers are
        # current, a cheap round trip beats a stale price.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Every URL is a real prerendered directory (/en/alternatives/notion/index.html).
    #
    # The last fallback used to be `/index.html`, which answered 200 for ANY
    # unmatched URL — a soft 404, and an unlimited supply of them, since every
    # misspelling produced a real-looking page with the full index on it. The app
    # already renders the honest thing for an unknown route (the list, a line
    # saying the page does not exist, and `noindex`); the status line now agrees
    # with it.
    #
    # `$uri/index.html` is tried before `$uri/` on purpose. With `$uri/` first,
    # the directory matched and nginx emitted its own add-the-trailing-slash 301
    # — and the no-slash form is what every canonical, hreflang, og:url and
    # sitemap entry on the site names, so 99.8% of them redirected.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Prerendered by scripts/prerender.ts — the same app shell, so a reader still
    # lands somewhere useful instead of on nginx's default page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
