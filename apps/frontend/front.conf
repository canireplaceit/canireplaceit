server {
    listen 80 default_server;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames — safe to cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Regenerated on every deploy. A crawler holding these for a year is a
    # crawler working from last month's inventory.
    location ~ ^/(sitemap.*\.xml|robots\.txt|counts\.json)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Every URL is a real prerendered directory (/en/alternatives/notion/index.html).
    # The SPA fallback only catches URLs prerender did not emit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
