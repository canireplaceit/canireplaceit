server {
    listen 80 default_server;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames — safe to cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Regenerated on every deploy. A crawler holding these for a year is a
    # crawler working from last month's inventory.
    location ~ ^/(sitemap.*\.xml|robots\.txt|llms\.txt|counts\.json)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # The published agent skill. One file on disk, two URLs: the discovery path
    # an agent runtime looks under, and a short one a person can paste.
    location = /skill.md {
        alias /usr/share/nginx/html/agent-skills/canireplaceit/SKILL.md;
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "public, max-age=3600";
    }

    # The build writes these to /agent-skills/ because a bundler copying a
    # public/ directory cannot be relied on to carry a dot-prefixed one.
    location ^~ /.well-known/agent-skills/ {
        alias /usr/share/nginx/html/agent-skills/;
        types {
            application/json json;
            text/markdown   md;
        }
        default_type application/json;
        charset utf-8;
        charset_types text/markdown application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Every page has a Markdown twin beside it. Without this nginx has no type
    # for .md and hands back octet-stream, which a browser downloads and some
    # crawlers skip.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
    }

    # Every URL is a real prerendered directory (/en/alternatives/notion/index.html).
    #
    # The last fallback used to be `/index.html`, which answered 200 for ANY
    # unmatched URL — a soft 404, and an unlimited supply of them, since every
    # misspelling produced a real-looking page with the full index on it. The app
    # already renders the honest thing for an unknown route (the list, a line
    # saying the page does not exist, and `noindex`); the status line now agrees
    # with it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Prerendered by scripts/prerender.ts — the same app shell, so a reader still
    # lands somewhere useful instead of on nginx's default page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
