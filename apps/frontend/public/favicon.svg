<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="canireplaceit">
  <title>canireplaceit</title>
  <!-- Two arrows trading places: grey leaves, blue arrives. Direction is the
       meaning, so the two are never the same colour — a symmetrical pair reads
       as "sync" rather than "replace".

       No background tile on purpose. A tile eats most of a 16x16 tab icon and
       the arrows inside collapse to a smudge; without it the strokes get the
       whole canvas. Same geometry as src/Mark.tsx — change one, change both. -->
  <path d="M24 10H8M13 5L7 10l6 5" stroke="#7d8590" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 22h16M19 17l6 5-6 5" stroke="#2f6fed" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
