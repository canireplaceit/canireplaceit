<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canireplaceit — UI/UX prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   canireplaceit — design system
   Grounded in Material Design 3 (m3.material.io, rev 38.0.1, read 2026-08-10)
   and adapted for a text-dense catalogue site. See DESIGN-GUIDELINES.md for
   the sourcing and for every place we deliberately deviate.

   The three things that changed from the previous pass, and why:
     1. Depth now comes from the SURFACE-CONTAINER TONAL RAMP, not from shadow.
        M3: "use shadows only when required to create additional protection
        against a background or to encourage interaction."
     2. Every spacing value is a token on the 8px scale. Nothing off-scale.
     3. Reading columns are measured in `ch`, because M3's only readability
        number is 40–60 characters per line.
   ========================================================================== */

:root {
  /* ---- spacing: M3's published token set (8px base + nested units) ------ */
  --sp-0:0px;    --sp-25:2px;   --sp-50:4px;   --sp-75:6px;
  --sp-100:8px;  --sp-125:10px; --sp-150:12px; --sp-175:14px;
  --sp-200:16px; --sp-250:20px; --sp-300:24px; --sp-400:32px;
  --sp-450:36px; --sp-500:40px; --sp-600:48px; --sp-700:56px;
  --sp-800:64px; --sp-900:72px;

  /* ---- shape: M3 corner scale ------------------------------------------ */
  --shape-none:0px;  --shape-xs:4px;  --shape-sm:8px;  --shape-md:12px;
  --shape-lg:16px;   --shape-xl:28px; --shape-full:9999px;

  /* ---- surfaces: neutral ramp at fixed L*, hue 289.8 (from the brand) ---
     Light steps 2 tones at a time; see the dark block for why it differs. */
  --surface:                   #f9f9ff;  /* N-98  page background          */
  --surface-dim:               #d9d9df;  /* N-87                           */
  --surface-bright:            #f9f9ff;  /* N-98                           */
  --surface-container-lowest:  #ffffff;  /* N-100                          */
  --surface-container-low:     #f3f3f9;  /* N-96  elevated card, banner    */
  --surface-container:         #ededf3;  /* N-94  DEFAULT container        */
  --surface-container-high:    #e8e8ed;  /* N-92  dialog, search           */
  --surface-container-highest: #e2e2e8;  /* N-90  filled card/field        */
  --on-surface:                #1b1b1f;  /* N-10                           */
  --on-surface-variant:        #454651;  /* NV-30 secondary text           */
  --outline:                   #767682;  /* NV-50 defines a target         */
  --outline-variant:           #c5c5d3;  /* NV-80 dividers, card borders   */
  --inverse-surface:           #303034;  /* N-20                           */
  --inverse-on-surface:        #f0f0f6;  /* N-95                           */
  --scrim:                     #000000;

  /* ---- accents ---------------------------------------------------------
     --brand is the identity hex and is NOT tone-40. --brand-text is its
     tone-45 sibling, used only where brand-coloured text sits at body size:
     #2f6fed measures 4.34:1 on --surface and fails AA for small text. */
  --brand:                #2f6fed;
  --brand-text:           #0e64e0;
  --on-brand:             #ffffff;
  --brand-container:      #dfe0ff;
  --on-brand-container:   #011944;

  --v-yes:                #026c46;  --v-yes-container:    #8ef7c2;
  --v-almost:             #8e4e00;  --v-almost-container: #ffdcc1;
  --v-no:                 #b02d2b;  --v-no-container:     #ffdad5;

  /* ---- elevation: dp distance + the material-web shadow implementation --
     Resting states use 0–3 only; 4 and 5 are interaction states. */
  --elev-0:none;
  --elev-1:0 1px 2px 0 rgb(0 0 0 / .30), 0 1px 3px 1px rgb(0 0 0 / .15);
  --elev-2:0 1px 2px 0 rgb(0 0 0 / .30), 0 2px 6px 2px rgb(0 0 0 / .15);
  --elev-3:0 1px 3px 0 rgb(0 0 0 / .30), 0 4px 8px 3px rgb(0 0 0 / .15);
  --elev-4:0 2px 3px 0 rgb(0 0 0 / .30), 0 6px 10px 4px rgb(0 0 0 / .15);

  /* ---- state layers ---------------------------------------------------- */
  --state-hover:.08; --state-focus:.10; --state-pressed:.10;

  /* ---- motion ---------------------------------------------------------- */
  --ease-standard:cubic-bezier(0.2,0,0,1);
  --ease-decelerate:cubic-bezier(0,0,0,1);
  --ease-accelerate:cubic-bezier(0.3,0,1,1);
  --dur-short:150ms; --dur-enter:250ms; --dur-exit:200ms; --dur-standard:300ms;

  /* ---- type ------------------------------------------------------------ */
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;

  /* ---- layout ---------------------------------------------------------- */
  --header-h:64px;          /* M3 small top app bar */
  --measure:1152px;         /* the grid column, shared by every index */
  --prose:62ch;             /* 40–60 characters, M3's readability rule */
  --margin:var(--sp-200);   /* compact page margin */
}

@media (min-width:600px){ :root{ --margin:var(--sp-300); } }

[data-theme="dark"]{
  /* Dark steps are 4→10→12→17→22, NOT an even ramp: perceptual separation at
     low luminance needs more tonal distance. Evening these out collapses them. */
  --surface:                   #131317;  /* N-6  */
  --surface-dim:               #131317;  /* N-6  */
  --surface-bright:            #39393d;  /* N-24 */
  --surface-container-lowest:  #0e0e13;  /* N-4  */
  --surface-container-low:     #1b1b1f;  /* N-10 */
  --surface-container:         #1f1f23;  /* N-12 */
  --surface-container-high:    #292a2e;  /* N-17 */
  --surface-container-highest: #343439;  /* N-22 */
  --on-surface:                #e2e2e8;  /* N-90 */
  --on-surface-variant:        #c5c5d3;  /* NV-80 */
  --outline:                   #8f909c;  /* NV-60 */
  --outline-variant:           #454651;  /* NV-30 */
  --inverse-surface:           #e2e2e8;
  --inverse-on-surface:        #303034;

  --brand:              #4c8dff;   /* measures 5.79:1 on --surface */
  --brand-text:         #4c8dff;   /* dark needs no darkened sibling */
  --on-brand:           #002d6e;
  --brand-container:    #02429a;
  --on-brand-container: #dfe0ff;

  --v-yes:    #72daa7;  --v-yes-container:    #015234;
  --v-almost: #ffb779;  --v-almost-container: #6c3a01;
  --v-no:     #ffb4a9;  --v-no-container:     #910516;
}

*,*::before,*::after{box-sizing:border-box}
html{
  scroll-behavior:smooth;background:var(--surface);
  scroll-padding-top:calc(var(--header-h) + var(--sp-300));
}
body{
  margin:0;background:var(--surface);color:var(--on-surface);
  font-family:var(--body);
  font-size:16px;line-height:24px;letter-spacing:.03125rem;   /* body-large */
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100dvh;
}
h1,h2,h3,h4{font-family:var(--display);margin:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}

/* ---- M3 type roles ----------------------------------------------------- */
.t-display{font-family:var(--display);font-size:clamp(2.25rem,1.6rem+2.9vw,3.5625rem);line-height:1.12;letter-spacing:-.015625rem;font-weight:700}
.t-headline{font-family:var(--display);font-size:clamp(1.75rem,1.45rem+1.3vw,2rem);line-height:1.25;font-weight:700}
.t-title-lg{font-family:var(--display);font-size:1.375rem;line-height:1.75rem;font-weight:600}
.t-title-md{font-family:var(--display);font-size:1rem;line-height:1.5rem;letter-spacing:.009375rem;font-weight:600}
.t-body{font-size:1rem;line-height:1.5rem;letter-spacing:.03125rem}
.t-body-md,.small{font-size:.875rem;line-height:1.25rem;letter-spacing:.015625rem}
.t-body-sm,.xs{font-size:.75rem;line-height:1rem;letter-spacing:.025rem}
.t-label{font-size:.875rem;line-height:1.25rem;letter-spacing:.00625rem;font-weight:500}
.eyebrow{
  font-family:var(--mono);font-size:.6875rem;line-height:1rem;
  text-transform:uppercase;letter-spacing:.1em;color:var(--on-surface-variant);
}
.nums{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--on-surface-variant)}
.center{text-align:center}

/* ---- layout ------------------------------------------------------------ */
.wrap{max-width:var(--measure);margin-inline:auto;padding-inline:var(--margin);width:100%}
.wrap-prose{max-width:var(--prose);margin-inline:auto;padding-inline:var(--margin);width:100%}
main{flex:1}
.grid{display:grid;gap:var(--sp-100)}
/* auto-fit rather than a column count: M3 no longer publishes a column grid,
   and a min track size adapts across all five breakpoints on its own. */
.grid-2{display:grid;gap:var(--sp-100);grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr))}
.grid-3{display:grid;gap:var(--sp-100);grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr))}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-100)}
.row-4{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-200)}
.mt-1{margin-top:var(--sp-50)}   .mt-2{margin-top:var(--sp-100)}
.mt-3{margin-top:var(--sp-150)}  .mt-4{margin-top:var(--sp-200)}
.mt-6{margin-top:var(--sp-300)}  .mt-8{margin-top:var(--sp-400)}
.mt-10{margin-top:var(--sp-500)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- state layer -------------------------------------------------------
   M3 models interaction as a translucent overlay BETWEEN container and
   content, tinted with the CONTENT colour. One shared implementation. */
.state{position:relative;isolation:isolate}
.state::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:currentColor;opacity:0;transition:opacity var(--dur-short) var(--ease-standard);
}
.state:hover::after{opacity:var(--state-hover)}
.state:focus-visible::after{opacity:var(--state-focus)}
.state:active::after{opacity:var(--state-pressed)}

:where(a,button,summary,input,select,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--brand);outline-offset:2px;border-radius:var(--shape-xs);
}

/* ---- card: M3 OUTLINED variant, elevation level 0 ----------------------
   Outlined carries the greatest emphasis of M3's three card variants, and
   needs no shadow at rest — which is what stops 48 of them reading as noise. */
.card{
  background:var(--surface);
  border:1px solid var(--outline-variant);
  border-radius:var(--shape-md);
  box-shadow:var(--elev-0);
}
.card-link{
  display:block;
  transition:border-color var(--dur-short) var(--ease-standard),
             box-shadow  var(--dur-short) var(--ease-standard);
}
/* Hover raises by exactly one level — M3's rule, not a bigger jump. */
.card-link:hover{border-color:var(--brand);box-shadow:var(--elev-1)}

/* The recessed grouping panel. A different surface ROLE, no second border. */
.panel{
  background:var(--surface-container);
  border-radius:var(--shape-md);
  padding:var(--sp-200);
}

/* ---- chip: 32px tall, 8px radius. NOT a pill — that shape is a button's,
   and the distinction is what stops a filter reading as an action. -------- */
.pill{
  display:inline-flex;align-items:center;gap:var(--sp-100);
  min-height:32px;padding-inline:var(--sp-200);
  border:1px solid var(--outline-variant);border-radius:var(--shape-sm);
  background:transparent;color:var(--on-surface-variant);
  font-size:.875rem;line-height:1.25rem;letter-spacing:.00625rem;font-weight:500;
  white-space:nowrap;
  transition:background-color var(--dur-short) var(--ease-standard),
             border-color var(--dur-short) var(--ease-standard),
             color var(--dur-short) var(--ease-standard);
}
.pill:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
/* Selected: container fill swap AND the outline goes to zero. */
.pill[aria-pressed="true"],.pill[data-active="true"]{
  background:var(--brand-container);color:var(--on-brand-container);
  border-color:transparent;
}
/* A chip that is a link out gets the 48px target via padding, not height. */
.pill.tap{min-height:40px}

/* ---- buttons: M3 small, 40px, full radius ------------------------------ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-100);
  min-height:40px;padding-inline:var(--sp-200);
  border-radius:var(--shape-full);border:1px solid transparent;
  font-size:.875rem;line-height:1.25rem;letter-spacing:.00625rem;font-weight:500;
  transition:box-shadow var(--dur-short) var(--ease-standard),
             border-color var(--dur-short) var(--ease-standard);
}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{box-shadow:var(--elev-1)}
.btn-ghost{border-color:var(--outline);color:var(--on-surface)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand-text)}
.btn-sm{min-height:32px;font-size:.8125rem;padding-inline:var(--sp-150)}

/* ---- text field: outlined, 56px, 4px radius ---------------------------- */
.field{
  width:100%;min-height:56px;
  border:1px solid var(--outline);border-radius:var(--shape-xs);
  background:transparent;color:var(--on-surface);
  padding-inline:var(--sp-200);
  font-size:1rem;line-height:1.5rem;
  transition:border-color var(--dur-short) var(--ease-standard);
}
.field::placeholder{color:var(--on-surface-variant)}
.field:hover{border-color:var(--on-surface)}
.field:focus{outline:none;border-color:var(--brand);border-width:2px;padding-inline:calc(var(--sp-200) - 1px)}
select.field{width:auto;min-width:0;padding-right:var(--sp-400)}
textarea.field{min-height:auto;padding-block:var(--sp-200)}
/* Filter bars pack many controls in one row; M3's dense step is −4px each. */
.dense .field{min-height:48px}

/* ---- top app bar: 64px, surface at rest, container + level 2 on scroll -- */
.site-header{
  position:sticky;top:0;z-index:40;
  background:var(--surface);
  transition:background-color var(--dur-short) var(--ease-standard),
             box-shadow var(--dur-short) var(--ease-standard);
}
.site-header[data-scrolled="true"]{background:var(--surface-container);box-shadow:var(--elev-2)}
.header-row{display:flex;align-items:center;gap:var(--sp-150);height:var(--header-h)}
@media(min-width:1280px){.header-row{gap:var(--sp-250)}}
.wordmark{display:flex;align-items:center;gap:var(--sp-100);font-family:var(--display);font-weight:700;font-size:1rem;flex-shrink:0}
.wordmark .i{color:var(--on-surface-variant)}
.wordmark .replace{color:var(--brand)}

.mainnav{margin-left:auto;display:none;align-items:center;gap:var(--sp-150);white-space:nowrap}
@media(min-width:1024px){.mainnav{display:flex}}
@media(min-width:1280px){.mainnav{gap:var(--sp-250)}}
.nav-link{
  position:relative;display:inline-flex;align-items:center;gap:var(--sp-50);
  min-height:40px;color:var(--on-surface-variant);
  font-size:.875rem;line-height:1.25rem;letter-spacing:.00625rem;font-weight:500;
  transition:color var(--dur-short) var(--ease-standard);
}
.nav-link:hover{color:var(--on-surface)}
/* Active indicator: M3 marks the active destination with a filled pill in
   secondary-container. On a horizontal bar that reads as a rule, so we keep
   the pill for the sheet and use a 2px underline here. */
.nav-link[data-current="true"]{color:var(--on-surface);font-weight:600}
.nav-link[data-current="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;
  border-radius:2px;background:var(--brand);
}
.nav-sep{width:1px;height:20px;background:var(--outline-variant)}

.actions{margin-left:auto;display:flex;align-items:center;gap:var(--sp-100);flex-shrink:0}
@media(min-width:1024px){.actions{margin-left:0}}
/* 48px targets. M3: a 24px icon still gets a 48px target. */
.icon-btn{
  display:grid;place-items:center;min-height:48px;min-width:48px;
  border-radius:var(--shape-full);color:var(--on-surface-variant);
  transition:background-color var(--dur-short) var(--ease-standard);
}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent);color:var(--on-surface)}
.icon-btn.wide{display:inline-flex;gap:var(--sp-75);padding-inline:var(--sp-150);
  font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.account{
  display:none;align-items:center;gap:var(--sp-75);max-width:12rem;min-height:40px;
  padding-inline:var(--sp-200);border:1px solid var(--outline);
  border-radius:var(--shape-full);font-size:.875rem;font-weight:500;
  transition:border-color var(--dur-short) var(--ease-standard);
}
.account:hover{border-color:var(--brand)}
@media(min-width:1024px){.account{display:inline-flex}}
.burger{display:grid}
@media(min-width:1024px){.burger{display:none}}

/* ---- menus: surface-container, level 2, 4px radius --------------------- */
.menu{position:relative}
.menu-panel{position:absolute;top:100%;left:0;padding-top:var(--sp-100);z-index:50;display:none}
.menu[open] .menu-panel{display:block}
.menu-panel>ul{
  width:300px;max-width:calc(100vw - 2rem);
  background:var(--surface-container);border-radius:var(--shape-xs);
  padding:var(--sp-100);box-shadow:var(--elev-2);color:var(--on-surface);
}
/* List item: M3 one-line list items are 56px; these carry a count so 48 is
   the dense step, and it is still a legal touch target. */
.navrow{
  display:flex;min-height:48px;align-items:center;gap:var(--sp-150);
  border-radius:var(--shape-sm);padding-inline:var(--sp-150);
  font-size:.875rem;line-height:1.25rem;
  transition:background-color var(--dur-short) var(--ease-standard);
}
.navrow:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.navrow[aria-current="page"]{background:var(--brand-container);color:var(--on-brand-container);font-weight:600}
.navrow .count{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--on-surface-variant)}
.navrow.all{margin-top:var(--sp-50);border-top:1px solid var(--outline-variant);color:var(--brand-text);font-weight:600}
.chev{transition:transform var(--dur-short) var(--ease-standard)}
.menu[open] .chev,.sheet-group[open] .chev{transform:rotate(180deg)}

/* ---- mobile sheet ------------------------------------------------------ */
.sheet{
  position:fixed;inset:var(--header-h) 0 0;z-index:39;display:none;overflow-y:auto;
  background:var(--surface-container-low);box-shadow:var(--elev-3);
}
.sheet.open{display:block;animation:sheet-in var(--dur-enter) var(--ease-decelerate)}
@keyframes sheet-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.sheet-inner{max-width:var(--measure);margin-inline:auto;padding:var(--sp-200);display:grid;gap:var(--sp-300)}
.sheet-group summary{list-style:none;cursor:pointer}
.sheet-group summary::-webkit-details-marker{display:none}
.sheet-group{border-top:1px solid var(--outline-variant);padding-top:var(--sp-100)}
.sheet-group>ul{display:grid;gap:var(--sp-25);padding-left:var(--sp-50);margin-top:var(--sp-50)}
@media(min-width:600px){.sheet-group>ul{grid-template-columns:1fr 1fr;column-gap:var(--sp-150)}}

/* ---- page head --------------------------------------------------------
   A different surface ROLE rather than a gradient wash: this is the tonal
   separation M3 uses instead of a shadow or a rule. */
.page-head{background:var(--surface-container-low);border-bottom:1px solid var(--outline-variant)}
.page-head-inner{padding-block:var(--sp-300) var(--sp-400)}
@media(min-width:600px){.page-head-inner{padding-block:var(--sp-300) var(--sp-500)}}
.trail{font-size:.875rem;line-height:1.25rem;color:var(--on-surface-variant)}
.trail ol{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-50) var(--sp-75)}
.trail li{display:flex;align-items:center;gap:var(--sp-75);min-width:0}
.trail a{padding-block:var(--sp-100)}
.trail a:hover{color:var(--on-surface);text-decoration:underline}
.trail [aria-current]{color:var(--on-surface)}
.trail .sep{opacity:.6;flex-shrink:0}
@media(max-width:599px){.trail .home-label{display:none}}
.head-main{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:var(--sp-200) var(--sp-300);margin-top:var(--sp-200)}
.head-title{display:flex;align-items:flex-start;gap:var(--sp-200);min-width:0}
h1.page-title{font-size:clamp(1.75rem,1.4rem+1.6vw,2rem);line-height:1.25;font-weight:700;text-wrap:balance}
.lede{margin-top:var(--sp-150);max-width:var(--prose);color:var(--on-surface-variant);text-wrap:pretty}
.head-meta{margin-top:var(--sp-200)}

/* ---- verdict ----------------------------------------------------------- */
.verdict{display:inline-flex;align-items:center;gap:var(--sp-100);flex-shrink:0}
.verdict .dot{width:8px;height:8px;border-radius:var(--shape-full);background:var(--vc)}
.verdict .word{font-family:var(--mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--vc)}
.v-yes{--vc:var(--v-yes)} .v-almost{--vc:var(--v-almost)} .v-no{--vc:var(--v-no)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.v-yes .dot{animation:pulse 2.4s var(--ease-standard) infinite}

.logo{
  display:grid;place-items:center;flex-shrink:0;border-radius:var(--shape-sm);
  border:1px solid var(--outline-variant);background:var(--surface-container-lowest);
  font-weight:600;color:var(--on-surface-variant);font-family:var(--display);
}

/* Tags are metadata, not controls: no target size, no hover. */
.tag{
  display:inline-flex;align-items:center;gap:var(--sp-50);
  border:1px solid var(--outline-variant);border-radius:var(--shape-xs);
  padding:var(--sp-25) var(--sp-75);
  font-family:var(--mono);font-size:.6875rem;line-height:1rem;
  text-transform:uppercase;letter-spacing:.06em;color:var(--on-surface-variant);
}
.tag.warn{border-color:var(--v-almost);color:var(--v-almost)}
.tag.bad{border-color:var(--v-no);color:var(--v-no)}
.tag.good{border-color:var(--v-yes);color:var(--v-yes)}
.tag.accent{border-color:var(--brand);color:var(--brand-text)}

/* ---- hero -------------------------------------------------------------- */
.hero{text-align:center;padding-block:var(--sp-700) var(--sp-600)}
@media(min-width:600px){.hero{padding-block:var(--sp-900) var(--sp-800)}}
.hero h1{
  font-family:var(--display);font-weight:700;text-wrap:balance;
  font-size:clamp(2.25rem,1.6rem+2.9vw,3.5625rem);line-height:1.12;letter-spacing:-.015625rem;
}
.cycler{display:inline-grid;color:var(--brand);vertical-align:baseline;justify-items:center}
.cycler>span{grid-area:1/1;border-bottom:3px solid var(--brand)}
.cycler>span[hidden]{visibility:hidden;display:block}
.hero .lede{margin:var(--sp-300) auto 0;font-size:1.125rem;line-height:1.75rem;max-width:60ch}
.hero-ctas{margin-top:var(--sp-500);display:flex;flex-wrap:wrap;gap:var(--sp-150);justify-content:center}
.statstrip{
  margin:var(--sp-600) auto 0;max-width:44rem;display:grid;
  grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--outline-variant);border:1px solid var(--outline-variant);
  border-radius:var(--shape-md);overflow:hidden;
}
@media(min-width:600px){.statstrip{grid-template-columns:repeat(4,1fr)}}
.statstrip>div{background:var(--surface);padding:var(--sp-200) var(--sp-150)}
.statstrip dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.75rem;line-height:2.25rem;font-weight:700}
.statstrip dt{margin-top:var(--sp-50);font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--on-surface-variant)}

/* ---- sponsor wall ------------------------------------------------------ */
.wall{
  display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
  background:var(--outline-variant);border:1px solid var(--outline-variant);
  border-radius:var(--shape-md);overflow:hidden;
}
@media(min-width:600px){.wall{grid-template-columns:repeat(5,1fr)}}
.wall a{
  position:relative;display:flex;min-height:72px;align-items:center;justify-content:center;
  gap:var(--sp-100);background:var(--surface);padding:var(--sp-200) var(--sp-150);
  text-align:center;font-size:.875rem;
}
.wall .open{color:var(--on-surface-variant)}
.wall .badge{
  position:absolute;right:var(--sp-100);bottom:var(--sp-75);
  font-family:var(--mono);font-size:.5625rem;text-transform:uppercase;
  letter-spacing:.16em;color:var(--on-surface-variant);
}
.wall .slotbox{
  display:grid;place-items:center;width:26px;height:26px;border-radius:var(--shape-sm);
  border:1px dashed var(--brand);color:var(--brand);flex-shrink:0;
}

/* ---- sticky filter bar ------------------------------------------------- */
.filterbar{
  position:sticky;top:var(--header-h);z-index:30;
  margin-inline:calc(var(--margin) * -1);
  padding:var(--sp-150) var(--margin);
  background:var(--surface);border-bottom:1px solid var(--outline-variant);
}
.filterbar-desktop{display:none;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-100)}
@media(min-width:1024px){.filterbar-desktop{display:grid}.filterbar-mobile{display:none}}
.filterbar-desktop>.field{grid-column:1/-1}
.filterbar-desktop>label{min-width:0}
.filterbar-desktop select.field{width:100%;grid-column:auto}

/* ---- product row ------------------------------------------------------- */
.prod{display:flex;align-items:flex-start;gap:var(--sp-150);padding:var(--sp-200)}
.prod .name{font-family:var(--display);font-size:1rem;line-height:1.5rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .price{font-family:var(--mono);font-size:.875rem;color:var(--on-surface-variant);flex-shrink:0}
.prod-body{min-width:0;flex:1}
.prod-line{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-100)}

/* ---- section ----------------------------------------------------------- */
.section{margin-top:var(--sp-500)}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--sp-50) var(--sp-200);margin-bottom:var(--sp-150)}
.section-head h2{font-family:var(--display);font-size:1.375rem;line-height:1.75rem;font-weight:600}
.section-head .count{margin-left:var(--sp-100);font-family:var(--mono);font-size:.875rem;color:var(--on-surface-variant);font-weight:400}
.link-more{color:var(--brand-text);font-size:.875rem;font-weight:500;padding-block:var(--sp-100)}
.link-more:hover{text-decoration:underline}

/* ---- pager ------------------------------------------------------------- */
.pager{margin-top:var(--sp-500);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:var(--sp-75)}
.pager .step,.pager .num{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-50);
  min-height:40px;min-width:40px;padding-inline:var(--sp-150);
  border:1px solid var(--outline-variant);border-radius:var(--shape-full);
  font-size:.875rem;font-weight:500;
  transition:border-color var(--dur-short) var(--ease-standard);
}
.pager .num{font-family:var(--mono)}
.pager .step:hover,.pager .num:hover{border-color:var(--brand)}
.pager [aria-current]{background:var(--brand-container);color:var(--on-brand-container);border-color:transparent}
.pager .off{opacity:.38}
.pagecount{margin-top:var(--sp-150);text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--on-surface-variant)}

/* ---- product detail ---------------------------------------------------- */
.detail{display:grid;gap:var(--sp-500)}
@media(min-width:1024px){.detail{grid-template-columns:minmax(0,1fr) 20rem;gap:var(--sp-600)}}
.detail aside{display:grid;gap:var(--sp-200);align-content:start}
@media(min-width:1024px){.detail aside{position:sticky;top:calc(var(--header-h) + var(--sp-300))}}
/* The argument is the one place on the site that is pure reading. */
.why{font-size:1.125rem;line-height:1.75rem;max-width:62ch;text-wrap:pretty}

.alt{border:1px solid var(--outline-variant);border-radius:var(--shape-md);background:var(--surface);padding:var(--sp-200);height:100%}
.alt.archived{border-color:var(--v-no)}
.alt-head{display:flex;align-items:center;gap:var(--sp-150)}
.alt-head .n{flex:1;min-width:0;font-family:var(--display);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt-head .n:hover{text-decoration:underline}
.alt .note{margin-top:var(--sp-100);font-size:.875rem;line-height:1.25rem;color:var(--on-surface-variant)}
.alt .tags{margin-top:var(--sp-150);display:flex;flex-wrap:wrap;gap:var(--sp-75)}

.callout{border-radius:var(--shape-md);padding:var(--sp-200);font-size:.875rem;line-height:1.25rem}
.callout.bad{background:var(--v-no-container);color:var(--on-surface)}

/* ---- category stats ---------------------------------------------------- */
.figures{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-200)}
@media(min-width:600px){.figures{grid-template-columns:repeat(4,1fr)}}
.figures dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.375rem;line-height:1.75rem;font-weight:700}
.figures dt{margin-top:var(--sp-25);font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--on-surface-variant)}
.ladder{display:flex;height:10px;border-radius:var(--shape-full);overflow:hidden;background:var(--outline-variant)}
.ladder span{display:block}
.ladder-legend{margin-top:var(--sp-100);display:flex;flex-wrap:wrap;gap:var(--sp-75) var(--sp-200);font-size:.75rem;color:var(--on-surface-variant)}
.ladder-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:var(--sp-75)}
.cat-row-grid{display:grid;gap:var(--sp-150);align-items:center}
@media(min-width:600px){.cat-row-grid{grid-template-columns:1fr auto}}

/* ---- features matrix --------------------------------------------------- */
.matrix-scroll{overflow-x:auto;border:1px solid var(--outline-variant);border-radius:var(--shape-md);background:var(--surface)}
table.matrix{border-collapse:collapse;width:100%;font-size:.875rem;min-width:640px}
table.matrix th,table.matrix td{padding:var(--sp-150) var(--sp-200);text-align:left;border-bottom:1px solid var(--outline-variant);white-space:nowrap}
table.matrix thead th{
  position:sticky;top:0;background:var(--surface-container);z-index:1;font-weight:500;
  font-family:var(--mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--on-surface-variant);
}
table.matrix tbody tr:last-child td{border-bottom:0}
table.matrix tbody tr:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
table.matrix th[scope=row]{font-weight:500;position:sticky;left:0;background:var(--surface)}
.mark-yes{color:var(--v-yes);font-weight:600}
.mark-paid{color:var(--v-almost);font-weight:600}
.mark-no{color:var(--v-no)}
.mark-unknown{color:var(--on-surface-variant)}

/* ---- footer ------------------------------------------------------------ */
.site-footer{margin-top:auto;background:var(--surface-container)}
.footer-inner{padding-block:var(--sp-800)}
.policy{max-width:62ch;border-left:3px solid var(--brand);padding-left:var(--sp-250);font-size:1.125rem;line-height:1.75rem;font-weight:500;text-wrap:pretty}
.footer-cols{margin-top:var(--sp-600);display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-500) var(--sp-300)}
@media(min-width:600px){.footer-cols{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){.footer-cols{grid-template-columns:repeat(5,1fr)}}
.footer-cols h2{font-family:var(--mono);font-size:.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--on-surface);font-weight:400}
.footer-cols ul{margin-top:var(--sp-150);display:grid;gap:var(--sp-25);font-size:.875rem}
.footer-cols a{display:inline-flex;align-items:center;min-height:40px;color:var(--on-surface-variant);transition:color var(--dur-short) var(--ease-standard)}
.footer-cols a:hover{color:var(--on-surface);text-decoration:underline}
.footer-base{margin-top:var(--sp-600);padding-top:var(--sp-300);border-top:1px solid var(--outline-variant);display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--sp-100);font-size:.75rem;color:var(--on-surface-variant)}

/* The prototype banner. Not part of the design — it says what this file is. */
.proto-banner{background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:.75rem;padding:var(--sp-75) var(--sp-200);text-align:center;font-family:var(--mono)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

</style>

function trail(items){
  return `<nav class="trail" aria-label="Breadcrumb"><ol>${items.map((it,i)=>`
    <li>${i>0?`<svg class="sep" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>`:""}
      ${it.href
        ? `<a href="${it.href}" data-nav>${i===0?`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="vertical-align:-2px"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg> <span class="home-label">${esc(it.label)}</span>`:esc(it.label)}</a>`
        : `<span aria-current="page">${esc(it.label)}</span>`}
    </li>`).join("")}</ol></nav>`;
}

/**
 * The page head band. Full-bleed wash, contents on the body's measure.
 * Every field is optional and the block collapses cleanly to just an <h1>.
 */
function pageHead({crumbs, eyebrow, title, lede, meta, aside, icon:ic, wide}){
  const cls = wide ? "wrap" : "wrap-prose";
  return `<div class="page-head"><div class="${cls} page-head-inner">
    ${crumbs ? trail(crumbs) : ""}
    ${(title||eyebrow||aside||ic) ? `<div class="head-main">
      <div class="head-title">
        ${ic||""}
        <div style="min-width:0">
          ${eyebrow ? `<p class="eyebrow" style="margin-bottom:6px">${eyebrow}</p>`:""}
          ${title ? `<h1 class="page-title">${title}</h1>`:""}
        </div>
      </div>
      ${aside ? `<div style="flex-shrink:0">${aside}</div>`:""}
    </div>`:""}
    ${lede ? `<p class="lede">${lede}</p>`:""}
    ${meta ? `<div class="head-meta">${meta}</div>`:""}
  </div></div>`;
}

const body = (html, wide) => `<div class="${wide?"wrap":"wrap-prose"}" style="padding-top:var(--sp-400);padding-bottom:var(--sp-900)">${html}</div>`;

const section = (title, inner, {count, more} = {}) => `
  <section class="section">
    <div class="section-head">
      <h2>${esc(title)}${count!==undefined?`<span class="count">${count}</span>`:""}</h2>
      ${more||""}
    </div>
    ${inner}
  </section>`;

function pager(page, pages, hrefFor, total, unit){
  if (pages <= 1) return "";
  const nums = [];
  for (let n=1;n<=pages;n++){
    if (n===1||n===pages||Math.abs(n-page)<=1) nums.push(n);
    else if (nums[nums.length-1]!=="gap") nums.push("gap");
  }
  return `<nav class="pager" aria-label="Pagination">
    ${page>1?`<a class="step" href="${hrefFor(page-1)}" data-nav>← ${t("prev")}</a>`:`<span class="step off">← ${t("prev")}</span>`}
    <ol style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
      ${nums.map(n => n==="gap"
        ? `<li class="muted" style="padding-inline:4px">…</li>`
        : `<li>${n===page?`<span class="num" aria-current="page">${n}</span>`:`<a class="num" href="${hrefFor(n)}" data-nav>${n}</a>`}</li>`).join("")}
    </ol>
    ${page<pages?`<a class="step" href="${hrefFor(page+1)}" data-nav>${t("next")} →</a>`:`<span class="step off">${t("next")} →</span>`}
  </nav>
  <p class="pagecount">${t("pageOf").replace("{n}",page).replace("{of}",pages)} · ${total} ${unit}</p>`;
}

const HERO_NAMES = ["Notion","Figma","Slack","Datadog","Airtable","Zendesk","Postman","Calendly"];
const PER_PAGE = 9;
let filters = {q:"",cat:"",verdict:"",openness:"",effort:"",price:"",sort:"weight"};
const filtersActive = () => filters.q||filters.cat||filters.verdict||filters.openness||filters.effort||filters.price||filters.sort!=="weight";

function applyFilters(list){
  let out = list.filter(p=>{
    if (filters.cat && p.cat!==filters.cat) return false;
    if (filters.verdict && p.verdict!==filters.verdict) return false;
    if (filters.effort && !p.alts.some(a=>a.effort===filters.effort)) return false;
    if (filters.price){
      const n=p.price;
      if (filters.price==="free" && n!==0) return false;
      if (filters.price==="lt25" && !(n>0&&n<25)) return false;
      if (filters.price==="25-100" && !(n>=25&&n<=100)) return false;
      if (filters.price==="gt100" && !(n>100)) return false;
    }
    if (filters.q){
      const q=filters.q.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !p.alts.some(a=>a.name.toLowerCase().includes(q))) return false;
    }
    return true;
  });
  if (filters.sort==="switched") out=[...out].sort((a,b)=>b.switched-a.switched);
  if (filters.sort==="price")    out=[...out].sort((a,b)=>b.price-a.price);
  if (filters.sort==="name")     out=[...out].sort((a,b)=>a.name.localeCompare(b.name));
  return out;
}

  return pageHead({

let projFilters = {q:"",openness:"",effort:""};

  const filtering = projFilters.q||projFilters.openness||projFilters.effort;
  const all = PROJECTS.filter(p=>{
    if (projFilters.openness && p.openness!==projFilters.openness) return false;
    if (projFilters.effort && p.effort!==projFilters.effort) return false;
    if (projFilters.q && !p.name.toLowerCase().includes(projFilters.q.toLowerCase())) return false;
    return true;
  });
  const per = 8, pages = Math.ceil(PROJECTS.length/per);
  const rows = filtering ? all : PROJECTS.slice((page-1)*per, page*per);

  return pageHead({
    wide:true,
    crumbs:[{label:t("home"),href:P.home()},{label:t("allProjects")}],
    eyebrow:t("alternatives"), title:t("projTitle"), lede:t("projBlurb"),

  }) + body(`

/* ---- features explorer ------------------------------------------------- */
let featState = {need:[], acceptPaid:false, q:""};
function featuresPage(){
  const MARK = {yes:['✓','mark-yes'],paid:['◐','mark-paid'],no:['✗','mark-no'],unknown:['—','mark-unknown']};
  const allFeatures = FEATURES.domains.flatMap(d=>d.features.map(f=>({...f, domain:d})));
  const shownFeatures = allFeatures.filter(f=>!featState.q || tc(f).toLowerCase().includes(featState.q.toLowerCase()));
  const ok = v => v==="yes" || (featState.acceptPaid && v==="paid");
  const rows = Object.keys(FEATURES.values)
    .filter(slug => featState.need.every(k => ok(FEATURES.values[slug][k])))
    .map(slug => ({slug, name:(projBy(slug)||{name:slug}).name, v:FEATURES.values[slug]}));

  return pageHead({
    wide:true,
    crumbs:[{label:t("home"),href:P.home()},{label:t("features")}],
    eyebrow:t("features"), title:t("featTitle"), lede:t("featBlurb"),
    meta:`<p class="nums small muted">${Object.keys(FEATURES.values).length*40} projects covered · ${allFeatures.length*15} features in the vocabulary · v4</p>`
  }) + body(`
    <div class="panel">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <input class="field" style="flex:1 1 16rem" id="feat-q" value="${esc(featState.q)}" placeholder="Search features — SSO, offline, backup…" aria-label="Search features">
        <label class="row" style="gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="feat-paid"${featState.acceptPaid?" checked":""}>
          Count features that are only in a paid tier
        </label>
      </div>
      <div style="margin-top:16px">
        <h2 class="eyebrow">${t("requireFeature")}</h2>
        <ul class="row" style="margin-top:8px">
          ${allFeatures.map(f=>`<li><button class="pill" data-need="${f.k}" aria-pressed="${featState.need.includes(f.k)}">${tc(f)}</button></li>`).join("")}
        </ul>
      </div>
    </div>

    <p class="nums small muted" style="margin-top:16px">${rows.length} projects match${featState.need.length?` · ${featState.need.length} requirement${featState.need.length>1?"s":""}`:""}</p>

    ${rows.length===0
      ? `<p class="card center muted" style="padding:48px 16px;margin-top:16px">Nothing matches every requirement. That is a real answer, not an empty page — loosen one, or allow paid tiers.</p>`
      : `<div class="matrix-scroll" style="margin-top:16px">
      <table class="matrix">
        <thead><tr><th scope="col">Project</th>${shownFeatures.map(f=>`<th scope="col" title="${esc(tc(f.domain))}">${tc(f)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <th scope="row"><a href="${P.project(r.slug)}" data-nav style="text-decoration:underline;text-underline-offset:2px">${esc(r.name)}</a></th>
          ${shownFeatures.map(f=>{const [g,c]=MARK[r.v[f.k]||"unknown"];return `<td class="${c}" style="text-align:center">${g}</td>`;}).join("")}
        </tr>`).join("")}</tbody>
      </table></div>`}

    <p class="panel t-body-sm muted" style="margin-top:var(--sp-500);display:flex;flex-wrap:wrap;gap:var(--sp-100) var(--sp-250)">
      ${Object.entries(MARK).map(([k,[g,c]])=>`<span><span class="${c}">${g}</span> ${T[LANG].matrixLegend[k]}</span>`).join("")}
    </p>
  `, true);
}

function parse(){
  const raw = location.hash.replace(/^#/,"") || `/${LANG}/`;
  const parts = raw.split("/").filter(Boolean);
  const lang = (parts[0]==="en"||parts[0]==="fr") ? parts[0] : "en";
  if (lang !== LANG){ LANG = lang; document.documentElement.lang = lang; }
  const [, seg, slug, sub, subslug] = parts;
  const S2 = SEG[LANG];
  const num = v => /^[0-9]+$/.test(v||"") ? Number(v) : 1;

  if (!seg) return {name:"home", page:1};
  if (seg === S2.page) return {name:"home", page:num(slug)};
  if (seg === S2.alternatives) return slug ? {name:"product", slug} : {name:"home", page:1};
  if (seg === S2.tools){
    if (!slug) return {name:"projects", page:1};
    if (slug === S2.page) return {name:"projects", page:num(sub)};
    return {name:"project", slug};
  }
  if (seg === S2.categories) return slug ? {name:"category", slug} : {name:"categories"};
  if (seg === S2.collections) return slug ? {name:"collection", slug} : {name:"collections"};
  if (seg === S2.features) return {name:"features"};
  if (seg === S2.stats) return {name:"stats"};
  if (seg === S2.sponsor) return {name:"sponsor"};
  if (seg === S2.submit) return {name:"submit"};
  if (seg === S2.estimate) return {name:"estimate"};
  if (seg === S2.signin) return {name:"signin"};
  if (seg === S2.legal) return {name:"legal"};
  return {name:"unknown"};
}

  home:"list", product:"list", unknown:"list",
  project:"projects", projects:"projects",

  collection:"collections", collections:"collections",

  projects:    r => projectsPage(r.page||1),
  categories:  () => categoriesPage(),
  category:    r => categoryPage(r.slug),
  collections: () => collectionsPage(),

  sponsor:     () => sponsorPage(),

let route = {name:"home", page:1};

function render(scroll = true){
  route = parse();
  document.getElementById("app").innerHTML = (VIEWS[route.name] || VIEWS.unknown)(route);
  renderChrome();
  startCycler();

  if (scroll && !location.hash.includes("#list")) window.scrollTo(0,0);

function startCycler(){
  clearInterval(cyclerTimer);
  const el = document.getElementById("cycler");
  if (!el) return;
  const spans = [...el.children];
  let i = 0;
  cyclerTimer = setInterval(()=>{
    spans[i].hidden = true;
    i = (i+1) % spans.length;
    spans[i].hidden = false;
  }, 2800);
}

const sheet = document.getElementById("sheet");
const burger = document.getElementById("burger");
function closeSheet(){ sheet.classList.remove("open"); burger.setAttribute("aria-expanded","false"); }
burger.addEventListener("click", () => {
  const open = sheet.classList.toggle("open");
  burger.setAttribute("aria-expanded", String(open));
});

/* One delegated listener for the whole document. */
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-nav]");
  if (a){
    // Let a same-page anchor behave like one.
    if (a.getAttribute("href").startsWith("#list") || a.getAttribute("href") === "#") return;
    closeSheet();
    document.querySelectorAll("details.menu[open]").forEach(d => d.open = false);
    return; // hashchange does the rendering
  }

  const pill = e.target.closest("[data-verdict]");
  if (pill){ filters.verdict = pill.dataset.verdict; render(false); return; }

  if (e.target.closest("#clear-filters")){
    filters = {q:"",cat:"",verdict:"",openness:"",effort:"",price:"",sort:"weight"}; render(false); return;
  }
  if (e.target.closest("#open-filters")){
    const box = document.getElementById("mobile-filters");
    if (box) box.hidden = !box.hidden;
    return;
  }
  const need = e.target.closest("[data-need]");
  if (need){
    const k = need.dataset.need;
    featState.need = featState.need.includes(k) ? featState.need.filter(x=>x!==k) : [...featState.need, k];
    render(false); return;
  }
  const plan = e.target.closest("[data-plan]");
  if (plan){
    const s = plan.dataset.plan;
    planPicked = planPicked.includes(s) ? planPicked.filter(x=>x!==s) : [...planPicked, s];
    render(false); return;
  }
  const sw = e.target.closest("[data-switch]");
  if (sw){ sw.textContent = "✓ " + t("reported"); sw.disabled = true; sw.style.opacity = ".6"; return; }

  // Any click outside an open dropdown shuts it.
  if (!e.target.closest("details.menu"))
    document.querySelectorAll("details.menu[open]").forEach(d => d.open = false);
});

document.addEventListener("input", e => {
  const f = e.target.dataset.filter;
  if (f){
    filters[f] = e.target.value;
    const at = e.target.selectionStart;
    render(false);
    if (f === "q"){
      const box = document.querySelector('[data-filter="q"]');
      if (box){ box.focus(); box.setSelectionRange(at, at); }
    }
    return;
  }
  const pf = e.target.dataset.pfilter;
  if (pf){
    projFilters[pf] = e.target.value;
    const at = e.target.selectionStart;
    render(false);
    if (pf === "q"){
      const box = document.querySelector('[data-pfilter="q"]');
      if (box){ box.focus(); box.setSelectionRange(at, at); }
    }
    return;
  }
  if (e.target.id === "feat-q"){
    featState.q = e.target.value;
    const at = e.target.selectionStart;
    render(false);
    const box = document.getElementById("feat-q");
    if (box){ box.focus(); box.setSelectionRange(at, at); }
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "feat-paid"){ featState.acceptPaid = e.target.checked; render(false); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    closeSheet();
    document.querySelectorAll("details.menu[open]").forEach(d => d.open = false);
  }
});

const setTheme = v => {
  document.documentElement.dataset.theme = v;
  document.documentElement.style.colorScheme = v;
  document.getElementById("theme-icon").textContent = v === "dark" ? "☀" : "☾";
  try { localStorage.setItem("proto-theme", v); } catch {}
};
themeBtn.addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* language — a navigation to the same page under the other locale, never a
   state flip, exactly as in the real app. */
document.getElementById("lang-toggle").addEventListener("click", () => {
  const other = LANG === "en" ? "fr" : "en";
  const r = route;
  LANG = other;
  document.documentElement.lang = other;
  const to =
    r.name === "product"     ? P.product(r.slug)    :
    r.name === "project"     ? P.project(r.slug)    :
    r.name === "projects"    ? P.projects(r.page)   :
    r.name === "category"    ? P.category(r.slug)   :
    r.name === "categories"  ? P.categories()       :
    r.name === "collection"  ? P.collection(r.slug) :
    r.name === "collections" ? P.collections()      :
    r.name === "features"    ? P.features()         :
    r.name === "stats"       ? P.stats()            :
    r.name === "sponsor"     ? P.sponsor()          :
    r.name === "submit"      ? P.submit()           :
    r.name === "estimate"    ? P.estimate()         :
    r.name === "signin"      ? P.signin()           :
    r.name === "legal"       ? P.legal()            :
                               P.home(r.page);
  location.hash = to;
});

window.addEventListener("hashchange", () => render(true));

/* The top app bar sits on `surface` at rest and lifts to `surface-container`
   + elevation level 2 once content scrolls under it — M3's app-bar rule, and
   the reason the bar needs no permanent border or backdrop blur. */
const header = document.querySelector(".site-header");
const onScroll = () => header.dataset.scrolled = String(window.scrollY > 4);
addEventListener("scroll", onScroll, {passive:true});
onScroll();

/* boot */
(function init(){
  let saved = null;
  try { saved = localStorage.getItem("proto-theme"); } catch {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  if (!location.hash) location.hash = "#/en/";
  render(true);
})();
</script>

</body>
</html>
