# The API sets its own max-age — 300 for everything, 3600 for the 7 MB dump —
# and two Cache-Control lines merge into a list a cache has to reconcile. So the
# upstream one is replaced rather than appended to, and this keeps the dump's
# longer TTL instead of flattening it.
map $uri $cri_api_cache {
	default           "public, max-age=300, stale-while-revalidate=3600";
	/api/v1/dump.json "public, max-age=3600, stale-while-revalidate=3600";
	# Per-user responses must never be cached, publicly or privately. /api/session
	# now reports `signedIn`, so a cached one tells a reader who just signed in
	# that they are signed out for up to an hour; and `public` on /api/me/* means
	# a shared cache can hand one advertiser another's campaigns.
	~^/api/session      "private, no-store";
	~^/api/me/          "private, no-store";
	~^/api/admin/       "private, no-store";
}

# nginx leaves $http_host empty on HTTP/3 — the client sends only :authority and
# no literal Host header — so passing it straight to an upstream hands it a blank
# Host and it answers 400. $host is derived from :authority and is never empty.
# Existing HTTP/1.1 and HTTP/2 traffic keeps the exact header it had before.
# Known crawlers, for the analytics beacon. Deliberately a denylist of tokens
# every one of these bots puts in its own UA, not a heuristic: a false positive
# here silently drops a real visitor, which is worse than counting a bot.
map $http_user_agent $cri_is_bot {
	default                                    0;
	"~*(bot|crawler|spider|crawling)"          1;
	"~*(Googlebot|Applebot|bingbot|Yandex)"    1;
	"~*(GPTBot|ClaudeBot|PerplexityBot|CCBot)" 1;
	"~*(OAI-SearchBot|meta-externalagent)"     1;
	"~*(HeadlessChrome|PhantomJS|Puppeteer)"   1;
	"~*(Chrome-Lighthouse|Screaming Frog)"     1;
	"~*(curl|wget|python-requests|Go-http)"    1;
}

map $http_host $cri_host {
	default $http_host;
	""      $host;
}

# The apex is the one document on the site with no prerendered body: 21 characters,
# `<div id="root"></div>`, zero visible words. Nothing paints until React runs, and
# then the whole 8,029 px document arrives in one frame. Measured, that single shift
# is CLS 0.625 on mobile and 0.278 on desktop, and it accounts for every performance
# point Lighthouse deducts — fixing all the other diagnostics and leaving it alone
# moves the score not at all. Redirecting means a browser only ever renders a
# document that was prerendered.
#
# French only when it is the client's FIRST preference. `en` is the canonical and
# the x-default, so an ambiguous header should land there rather than guess.
map $http_accept_language $cri_lang {
	default en;
	~*^fr   fr;
}

# Port 80 is otherwise a shared default_server that redirects scheme-only, so
# http://www took two hops: to https://www, then to the apex. A more specific
# server_name wins over a default_server, so this collapses both names to one.
server {
	listen 80;
	listen [::]:80;
	server_name canireplaceit.com www.canireplaceit.com;

	# Same webroot the 443 block below uses. Without it the renewal challenge
	# would ride the 301 into https, which is a hop that can only fail.
	location ~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://canireplaceit.com$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.canireplaceit.com;
	ssl_certificate     /etc/letsencrypt/live/canireplaceit.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/canireplaceit.com/privkey.pem;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	return 301 https://canireplaceit.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# QUIC without `reuseport`: this nginx is shared with other sites and the
	# option may appear only once per address:port across the whole config, so
	# claiming it here could break every other site on the box.
	listen 443 quic reuseport;
	listen [::]:443 quic reuseport;
	http2 on;
	server_name canireplaceit.com;

	ssl_certificate     /etc/letsencrypt/live/canireplaceit.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/canireplaceit.com/privkey.pem;

	resolver 127.0.0.11 valid=10s;
	set $cri_fe canireplaceit-fe;
	set $cri_be canireplaceit-be;

	client_max_body_size 2m;

	gzip on;
	gzip_vary on;
	# nginx's default level is 1. The homepage measured 232 KB at 1 and 190 KB at
	# 6; 9 measured slightly worse than 6 for much more CPU.
	gzip_comp_level 6;
	# text/xml, not application/xml, is what nginx labels the sitemaps — the old
	# list named only the latter, so 1.79 MB of sitemap shipped raw. text/markdown
	# was missing entirely, which is every Markdown twin, the thing built for the
	# AI crawlers.
	gzip_types text/plain text/css text/xml text/markdown application/javascript application/json application/xml application/atom+xml image/svg+xml;
	# The old floor of 1024 skipped favicon.svg at 843 bytes.
	gzip_min_length 256;

	# The redirect chain still starts on port 80 for anyone typing the bare
	# domain, so the first request of a session is plaintext until a browser has
	# been told once that it never needs to be.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	# Advertises the QUIC listener above; without it no client ever tries h3.
	add_header Alt-Svc 'h3=":443"; ma=86400' always;

	location /api/ {
		proxy_pass http://$cri_be:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $cri_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;

		proxy_hide_header Cache-Control;
		# No `always`: with it, a 502 from a restarting backend is served
		# `public, max-age=300, stale-while-revalidate=3600`, so a blip of a few
		# seconds becomes an hour of cached failure for anyone who hit it. Without
		# it the header applies to the success and redirect codes only, and an
		# error carries none.
		add_header Cache-Control $cri_api_cache;
		# add_header does not inherit into a level that declares one of its own,
		# so the site-wide headers have to be repeated here or /api/ loses them.
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Alt-Svc 'h3=":443"; ma=86400' always;
	}

	# ponytail: proxy the umami container over the shared nginx network, not its
	# public hostname — a public hairpin re-enters nginx and stamps X-Real-IP with
	# the docker bridge gateway, which umami ranks above XFF, so geo comes out null.
	location ~ ^/u/(.*)$ {
		# Analytics is for people. Umami's own isbot filter already discards most
		# of these server-side (28,623 beacon POSTs in 19 days became 3,614 counted
		# pageviews), but they still cost a proxied request and a database round
		# trip, and anything isbot does not recognise gets counted as a visitor.
		# Googlebot alone fired 8,577 of them while rendering pages.
		if ($cri_is_bot) { return 204; }
		set $cri_umami umami:3000;
		proxy_pass http://$cri_umami/$1$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Host $cri_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# The feed is generated from the catalogue, so it is served by the API. It
	# should still read as a site URL, because /feed.xml is where a reader and a
	# feed reader both look for one.
	location = /feed.xml {
		proxy_pass http://$cri_be:3001/api/v1/feed.xml;
		proxy_http_version 1.1;
		proxy_set_header Host $cri_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Exact match, so it catches the apex and nothing else; every other path still
	# falls through to `location /` below. 302 rather than 301 because the target
	# depends on Accept-Language, and a cached 301 would pin one visitor's language
	# onto everyone behind the same shared cache.
	location = / {
		# add_header does not inherit into a level that declares one of its own, so
		# the site-wide headers have to be repeated here, exactly as `/api/` above
		# already has to. Without this the apex answered with `location` and `vary`
		# alone. Dropping HSTS here is the worst place to drop it: this is the URL
		# people type into an address bar, which is the request HSTS exists to
		# protect.
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		# Alt-Svc is deliberately NOT repeated. UDP/443 is closed, so every other
		# location advertises an h3 endpoint that refuses the connection. Until that
		# is settled, one honest URL beats a consistent lie. Add it back the same day
		# the port opens.
		add_header Vary Accept-Language;
		# $is_args$args or the redirect eats the query string: `location = /` matches
		# on path alone, so `/?utm_source=newsletter` landed on a bare `/en/` and
		# every campaign link to the bare domain recorded as direct traffic. The www
		# block forwards $request_uri correctly and this one then threw it away.
		return 302 https://$cri_host/$cri_lang/$is_args$args;
	}

	location / {
		proxy_pass http://$cri_fe:80;
		proxy_http_version 1.1;
		proxy_set_header Host $cri_host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
}
