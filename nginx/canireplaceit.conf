server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.canireplaceit.com;
	ssl_certificate     /etc/letsencrypt/live/canireplaceit.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/canireplaceit.com/privkey.pem;
	return 301 https://canireplaceit.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name canireplaceit.com;

	ssl_certificate     /etc/letsencrypt/live/canireplaceit.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/canireplaceit.com/privkey.pem;

	resolver 127.0.0.11 valid=10s;
	set $cri_fe canireplaceit-fe;
	set $cri_be canireplaceit-be;

	client_max_body_size 2m;

	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
	gzip_min_length 1024;

	location /api/ {
		proxy_pass http://$cri_be:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}

	location ~ ^/u/(.*)$ {
		set $cri_umami umami.example.com;
		proxy_pass https://$cri_umami/$1$is_args$args;
		proxy_http_version 1.1;
		proxy_ssl_server_name on;
		proxy_set_header Host $cri_umami;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://$cri_fe:80;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
}
