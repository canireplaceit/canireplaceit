server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.canireplaceit.com;
	ssl_certificate     /etc/letsencrypt/live/canireplaceit.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/canireplaceit.com/privkey.pem;
	return 301 https://canireplaceit.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name canireplaceit.com;

	ssl_certificate     /etc/letsencrypt/live/canireplaceit.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/canireplaceit.com/privkey.pem;

	resolver 127.0.0.11 valid=10s;
	set $cri_fe canireplaceit-fe;
	set $cri_be canireplaceit-be;

	client_max_body_size 2m;

	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
	gzip_min_length 1024;

	location /api/ {
		proxy_pass http://$cri_be:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}

	# ponytail: proxy the umami container over the shared nginx network, not its
	# public hostname — a public hairpin re-enters nginx and stamps X-Real-IP with
	# the docker bridge gateway, which umami ranks above XFF, so geo comes out null.
	location ~ ^/u/(.*)$ {
		set $cri_umami umami:3000;
		proxy_pass http://$cri_umami/$1$is_args$args;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# The feed is generated from the catalogue, so it is served by the API. It
	# should still read as a site URL, because /feed.xml is where a reader and a
	# feed reader both look for one.
	location = /feed.xml {
		proxy_pass http://$cri_be:3001/api/v1/feed.xml;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		proxy_pass http://$cri_fe:80;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
}
